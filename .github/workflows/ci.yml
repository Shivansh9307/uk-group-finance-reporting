name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Fixture paths for the model and report jobs. Later tasks point these at the real model and report.
  BPA_MODEL_DIR: tests/fixtures/ci_spike/Minimal.SemanticModel/definition
  BPA_RULES: tests/fixtures/ci_spike/bpa-rules.json
  BPA_FAIL_AT_SEVERITY: "3"   # violations at or above this severity fail the job; below it they only warn
  REPORT_DIR: tests/fixtures/ci_spike/Minimal.Report
  REPORT_RULES: tests/fixtures/ci_spike/report-rules.json
  REPORT_RULES_NEGATIVE: tests/fixtures/ci_spike/report-rules-negative.json

  # Tool pins. The sha256 values are the release-asset digests published on GitHub,
  # checked again after download.
  TE2_VERSION: "2.29.0"
  TE2_SHA256: c0d3a7abda4572baaf3aeedf9cb342ce7ad4d9840e6438d6b13df02267d308a4
  FABINSP_VERSION: "v4.0.0"
  FABINSP_SHA256: ac4ef0c92c74f18e22eeaa6cc21763dfbcebe1541fb5f6c8b81495cb8bf96fae
  MSSQL_IMAGE: mcr.microsoft.com/mssql/server:2022-latest

  # Throwaway SA password for the SQL container that lives for one job. Not a secret,
  # but never printed: it is masked in the first step that uses it.
  CI_SQL_SA_PASSWORD: Ci_Throwaway_2026x

jobs:
  model-bpa:
    name: model-bpa
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # restore + save instead of actions/cache, so the cache is written even when BPA fails
      # (actions/cache only saves in its post step on a successful job).
      - name: Restore Tabular Editor 2 from cache
        id: te2-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/te2
          key: te2-portable-${{ env.TE2_VERSION }}-${{ env.TE2_SHA256 }}

      - name: Download Tabular Editor 2 portable
        if: steps.te2-cache.outputs.cache-hit != 'true'
        run: |
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $zip = Join-Path $env:RUNNER_TEMP 'TabularEditor.Portable.zip'
          Invoke-WebRequest -Uri "https://github.com/TabularEditor/TabularEditor/releases/download/$env:TE2_VERSION/TabularEditor.Portable.zip" -OutFile $zip
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:TE2_SHA256) { throw "sha256 mismatch: got $actual" }
          Expand-Archive $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'te2') -Force
          Write-Host "Downloaded and verified in $([math]::Round($sw.Elapsed.TotalSeconds,1)) s"

      - name: Save Tabular Editor 2 to cache
        if: steps.te2-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/te2
          key: te2-portable-${{ env.TE2_VERSION }}-${{ env.TE2_SHA256 }}

      - name: Check which compatibility levels TE2 loads
        # TE2 reads compatibilityLevel from database.tmdl; this loads copies of the fixture at
        # 1600, 1606 (current Desktop) and 1702 and prints what TE2 sees. Informational only.
        run: |
          $te = Join-Path $env:RUNNER_TEMP 'te2/TabularEditor.exe'
          foreach ($cl in 1600, 1606, 1702) {
            $dir = Join-Path $env:RUNNER_TEMP "cl$cl/definition"
            New-Item -ItemType Directory -Force (Split-Path $dir) | Out-Null
            Copy-Item -Recurse $env:BPA_MODEL_DIR $dir
            Set-Content (Join-Path $dir 'database.tmdl') "database`r`n`tcompatibilityLevel: $cl`r`n"
            # -S runs an inline C# script after load; Info() writes to the console.
            & $te $dir -S 'Info("loaded at compatibility level " + Model.Database.CompatibilityLevel);' | Select-String 'loaded|rror'
            Write-Host "compatibilityLevel $cl -> exit $LASTEXITCODE"
          }

      - name: Best Practice Analyzer
        run: |
          $sw = [Diagnostics.Stopwatch]::StartNew()
          ./.github/scripts/run-bpa.ps1 `
            -TabularEditor (Join-Path $env:RUNNER_TEMP 'te2/TabularEditor.exe') `
            -Model $env:BPA_MODEL_DIR `
            -Rules $env:BPA_RULES `
            -FailAtSeverity ([int]$env:BPA_FAIL_AT_SEVERITY) `
            -TrxPath (Join-Path $env:RUNNER_TEMP 'bpa-results.trx')
          $code = $LASTEXITCODE
          Write-Host "BPA step took $([math]::Round($sw.Elapsed.TotalSeconds,1)) s"
          exit $code

      - name: Upload BPA results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bpa-results
          path: ${{ runner.temp }}/bpa-results.trx
          if-no-files-found: ignore
          retention-days: 14

  pipeline-sql:
    name: pipeline-sql
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # The build and the tests read these (see docs/pipeline.md). A user means SQL authentication.
      # UKFR_SQL_PASSWORD is copied from CI_SQL_SA_PASSWORD in the first step, because job-level env
      # cannot read the workflow-level env context.
      UKFR_SQL_SERVER: localhost,1433
      UKFR_SQL_USER: sa
      UKFR_SQL_DATABASE: UKGroupFinance
      UKFR_REQUIRE_DB: "1"   # a database test that cannot run fails instead of skipping
      UV_VERSION: "0.12.7"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start SQL Server container
        # Started with docker run rather than a services: block, because services cannot read
        # the workflow-level env context, and this also lets me time start-to-ready exactly.
        run: |
          echo "::add-mask::$CI_SQL_SA_PASSWORD"
          echo "UKFR_SQL_PASSWORD=$CI_SQL_SA_PASSWORD" >> "$GITHUB_ENV"
          t0=$(date +%s.%N)
          docker pull -q "$MSSQL_IMAGE" >/dev/null
          t1=$(date +%s.%N)
          docker run -d --name mssql -p 1433:1433 \
            -e ACCEPT_EULA=Y -e MSSQL_PID=Developer -e MSSQL_SA_PASSWORD="$CI_SQL_SA_PASSWORD" \
            "$MSSQL_IMAGE" >/dev/null
          t2=$(date +%s.%N)
          echo "container_pull_s=$(printf '%.1f' "$(echo "$t1 - $t0" | bc)")" | tee -a "$RUNNER_TEMP/timings.txt"
          echo "CONTAINER_STARTED=$t2" >> "$GITHUB_ENV"

      # restore + save instead of actions/cache, so the cache is written even when a later step fails
      # (actions/cache only saves in its post step on a successful job). The key holds the uv version
      # and the lock file, so a changed dependency makes a new cache.
      - name: Restore the uv cache
        id: uv-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ env.UV_VERSION }}-${{ hashFiles('pipeline/uv.lock') }}

      - name: Install uv and the project
        run: |
          source .github/scripts/step-timer.sh
          python3 -m venv "$RUNNER_TEMP/uv-venv"
          "$RUNNER_TEMP/uv-venv/bin/pip" install -q --disable-pip-version-check "uv==$UV_VERSION"
          echo "$RUNNER_TEMP/uv-venv/bin" >> "$GITHUB_PATH"
          echo "uv_cache_hit=${{ steps.uv-cache.outputs.cache-hit }}" | tee -a "$RUNNER_TEMP/timings.txt"
          timed uv_sync "$RUNNER_TEMP/uv-venv/bin/uv" sync --project pipeline --frozen

      - name: Prune the uv cache before it is saved
        if: always() && steps.uv-cache.outputs.cache-hit != 'true'
        run: uv cache prune --ci

      - name: Save the uv cache
        if: always() && steps.uv-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ env.UV_VERSION }}-${{ hashFiles('pipeline/uv.lock') }}

      - name: Committed files, unit tests that need no database, assertion inventory
        # `ukfr inventory` lists every SQL assertion with its scope and marker and fails when a file in
        # sql/tests has no `-- test:` header or docs/reconciliation.md is out of date.
        run: |
          source .github/scripts/step-timer.sh
          timed fetch_verify uv run --project pipeline --frozen ukfr fetch --verify
          timed unit_tests bash -o pipefail -c 'uv run --project pipeline --frozen pytest -q -m "not db" | tee "$RUNNER_TEMP/pytest-unit.txt"'
          timed inventory bash -o pipefail -c 'uv run --project pipeline --frozen ukfr inventory | tee "$RUNNER_TEMP/assertion-inventory.txt"'

      - name: Build the database from the committed files
        # --wait covers the seconds between the log saying "ready" and the first accepted login.
        run: |
          source .github/scripts/step-timer.sh
          timed build bash -o pipefail -c 'uv run --project pipeline --frozen ukfr build --scope committed --wait 120 | tee "$RUNNER_TEMP/build.txt"'

      - name: Database tests
        run: |
          source .github/scripts/step-timer.sh
          timed db_tests bash -o pipefail -c 'uv run --project pipeline --frozen pytest -q -m db | tee "$RUNNER_TEMP/pytest-db.txt"'

      - name: Rebuild from scratch and compare the audit output
        # A second build into a new database must write byte-identical audit files, and the files
        # committed under evidence/build must be the ones the build writes.
        run: |
          source .github/scripts/step-timer.sh
          timed rebuild env UKFR_SQL_DATABASE=UKGroupFinance_rebuild uv run --project pipeline --frozen ukfr build \
            --scope committed --recreate --audit-dir "$RUNNER_TEMP/audit-rebuild"
          diff -r evidence/build "$RUNNER_TEMP/audit-rebuild"
          git diff --exit-code -- evidence/build data/audit
          echo "audit output identical across two builds and equal to the committed copy"

      - name: Negative control (the controls must fail on a planted error)
        # Plants a wrong control total, a wrong raw amount and a wrong fact amount, one at a time, in the
        # throwaway second database (never the one the tests ran against), runs the controls that must
        # notice and requires each to FAIL, then restores the value and requires them to pass again.
        # The step is green only if every planted error was caught. No file in the repository changes.
        env:
          UKFR_SQL_DATABASE: UKGroupFinance_rebuild
        run: |
          source .github/scripts/step-timer.sh
          timed negative_control uv run --project pipeline --frozen ukfr negative-control
          test -z "$(git status --porcelain)" && echo "the working tree is unchanged"

      - name: Summary
        if: always()
        run: |
          {
            echo "### pipeline-sql"
            echo
            echo "Seconds per step (the job also spends time on checkout, the cache and the container, see the step list):"
            echo '```'
            cat "$RUNNER_TEMP/timings.txt" 2>/dev/null
            echo '```'
            echo
            echo "Test results:"
            echo '```'
            for f in pytest-unit pytest-db; do
              echo "$f: $(tail -n 1 "$RUNNER_TEMP/$f.txt" 2>/dev/null)"
            done
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  report-checks:
    name: report-checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Probe .NET runtimes
        id: dotnet
        run: |
          dotnet --list-runtimes 2>/dev/null || echo "dotnet not found"
          if dotnet --list-runtimes 2>/dev/null | grep -q '^Microsoft.NETCore.App 10\.'; then
            echo "have10=true" >> "$GITHUB_OUTPUT"
          else
            echo "have10=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install .NET 10 runtime
        if: steps.dotnet.outputs.have10 != 'true'
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      # restore + save instead of actions/cache, so the cache is written even when a later
      # step fails (actions/cache only saves in its post step on a successful job).
      - name: Restore Fab Inspector from cache
        id: fi-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/fab-inspector
          key: fab-inspector-linux-x64-${{ env.FABINSP_VERSION }}-${{ env.FABINSP_SHA256 }}

      - name: Download Fab Inspector CLI
        if: steps.fi-cache.outputs.cache-hit != 'true'
        run: |
          t0=$(date +%s.%N)
          zip="$RUNNER_TEMP/linux-x64-FabInspCLI.zip"
          curl -fsSL -o "$zip" "https://github.com/NatVanG/fab-inspector/releases/download/$FABINSP_VERSION/linux-x64-FabInspCLI.zip"
          echo "$FABINSP_SHA256  $zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/fab-inspector"
          unzip -q "$zip" -d "$RUNNER_TEMP/fab-inspector"
          echo "download_s=$(echo "$(date +%s.%N) - $t0" | bc)"

      - name: Save Fab Inspector to cache
        if: steps.fi-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/fab-inspector
          key: fab-inspector-linux-x64-${{ env.FABINSP_VERSION }}-${{ env.FABINSP_SHA256 }}

      - name: Locate CLI
        run: |
          exe="$RUNNER_TEMP/fab-inspector/linux-x64/FabInspCLI/fab-inspector"
          chmod +x "$exe"
          echo "FABINSP=$exe" >> "$GITHUB_ENV"

      - name: Report rules
        run: bash .github/scripts/run-report-rules.sh "$FABINSP" "$REPORT_DIR" "$REPORT_RULES" "$RUNNER_TEMP/report-checks"

      - name: Negative control (must fail)
        # The same rule with a limit of one visual per page. The step passes only if the gate
        # script exits non-zero, which proves a failing rule would fail the build.
        run: |
          # The expected failure is demoted to a notice so a green run carries no red annotation.
          if bash .github/scripts/run-report-rules.sh "$FABINSP" "$REPORT_DIR" "$REPORT_RULES_NEGATIVE" "$RUNNER_TEMP/report-checks-negative" \
              | sed -u 's/^::error::/::notice::/'; then
            echo "::error::the negative control passed; the gate is not detecting failed rules"; exit 1
          fi
          echo "negative control failed as expected"

      - name: Exit code with -formats GitHub on a failing rule (informational)
        continue-on-error: true
        run: |
          set +e
          "$FABINSP" -fabricitem "$REPORT_DIR" -rules "$REPORT_RULES_NEGATIVE" -formats "GitHub" \
            | sed 's/^::error/::warning/'   # demoted so this probe does not add a red annotation
          echo "exit code with -formats GitHub: ${PIPESTATUS[0]}"

      - name: Upload report check results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: report-checks
          path: |
            ${{ runner.temp }}/report-checks
            ${{ runner.temp }}/report-checks-negative
          if-no-files-found: ignore
          retention-days: 14
