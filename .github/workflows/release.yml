name: Release

# Designed, not run: no tag has been pushed. The first run will be the first test of this file.
#
# A tag that starts with v publishes a release. The release carries two archives: the Power BI project (model/, the
# semantic model in TMDL and the report in PBIR, without the cache and the local settings Desktop writes) and
# evidence/ (the ledger and everything that was compared). Nothing is published unless the ledger check passes on the
# tagged commit, so a release never holds a model whose test evidence is stale.
#
# The notes of the release are the message of the tag: create the tag with `git tag -a v1.0 -m "..."`.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # gh release create
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Ledger check
        # The same check as the evidence-ledger job of ci.yml, on the tagged commit.
        env:
          PYTHONPATH: pipeline/src
        run: python3 -m ukfr.ledger check

      - name: Read the notes from the tag message
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --force --tags origin
          git tag -l --format='%(contents)' "$TAG" > "$RUNNER_TEMP/notes.txt"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.txt"; then
            echo "::error::the tag $TAG has no message: create it with git tag -a $TAG -m '...'"
            exit 1
          fi

      - name: Archive the project and the evidence
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          zip -q -r "$RUNNER_TEMP/release/ukgroupfinance-pbip-$TAG.zip" model \
            -x '*/.pbi/cache.abf' -x '*/.pbi/localSettings.json'
          zip -q -r "$RUNNER_TEMP/release/ukgroupfinance-evidence-$TAG.zip" evidence
          if unzip -l "$RUNNER_TEMP/release/ukgroupfinance-pbip-$TAG.zip" | grep -E 'cache\.abf|localSettings\.json'; then
            echo "::error::the project archive holds a cache or local settings file"
            exit 1
          fi
          ls -l "$RUNNER_TEMP/release"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.txt" \
            --verify-tag \
            "$RUNNER_TEMP/release/ukgroupfinance-pbip-$TAG.zip" \
            "$RUNNER_TEMP/release/ukgroupfinance-evidence-$TAG.zip"
