[project]
name = "ukfr"
version = "0.1.0"
description = "Fetch, normalise and load the public sources behind UK Group Finance Reporting"
readme = "README.md"
authors = [
    { name = "Shivansh Chauhan", email = "shivansh369.chauhan@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "inflate64>=1.0.4",
    "pyyaml>=6.0.3",
]

[project.scripts]
ukfr = "ukfr.cli:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
